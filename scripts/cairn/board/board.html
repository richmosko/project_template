<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cairn</title>
<link rel="stylesheet" href="/board/board.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-row">
    <span class="app-title">cairn</span>
    <!-- PT-1: minimal live/polling indicator -- board.js's connectLive()
         drives the text/class; starts "polling" until SSE confirms open. -->
    <span class="connection-state polling" id="connection-state">○ polling</span>
    <div class="majors-tabs" id="majors-tabs"></div>
    <div class="view-tabs">
      <a href="/" id="tab-kanban">Kanban</a>
      <a href="/list" id="tab-list">List</a>
    </div>
    <button id="new-issue-btn" class="new-issue-btn" type="button">+ New</button>
  </div>
  <div class="milestone-progress" id="milestone-progress"></div>
  <div class="filters">
    <input type="text" id="filter-text" placeholder="Filter…">
    <select id="filter-milestone"><option value="">All milestones</option></select>
    <select id="filter-assignee"><option value="">All assignees</option></select>
    <select id="filter-label"><option value="">All labels</option></select>
    <!-- PT-3: hidden by default, shown only when the board payload carries
         more than one root (renderHeader toggles the hidden attribute). -->
    <select id="filter-repo" hidden><option value="">All repos</option></select>
    <label><input type="checkbox" id="filter-cancelled"> Show cancelled</label>
    <label><input type="checkbox" id="toggle-swimlanes" checked> Swimlanes</label>
  </div>
  <!-- Minimal create affordance: title + milestone only, per the spec's
       "issue creation from the board beyond title + milestone" being the
       out-of-phase-1-scope line (implying title+milestone IS in scope).
       See process/TRACKER.md and architect conformance review finding 5. -->
  <div class="new-issue-form" id="new-issue-form" hidden>
    <input type="text" id="new-issue-title" placeholder="New issue title…">
    <select id="new-issue-milestone"><option value="">No milestone</option></select>
    <button id="new-issue-submit" type="button">Create</button>
    <button id="new-issue-cancel" type="button">Cancel</button>
  </div>
</header>

<main id="main"></main>

<div class="drawer-overlay" id="drawer-overlay">
  <div class="drawer" id="drawer" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast"></div>

<!-- PT-4: vendored (checked-in, no CDN) -- see vendor/NOTICE.md for
     version/license/provenance. Loaded before board.js so renderMarkdown's
     window.marked / window.DOMPurify feature-check sees them. -->
<script src="/board/vendor/marked.js"></script>
<script src="/board/vendor/purify.min.js"></script>
<!-- PT-22: pure-logic functions, unit-tested independently of the DOM
     (scripts/cairn/tests/js/). Must load before board.js -- board.js
     destructures the CairnLogic global at the top of its own IIFE, so a
     load-order mistake here throws at parse time instead of silently
     producing `undefined` deep inside a render. -->
<script src="/board/board-logic.js"></script>
<script src="/board/board.js"></script>
</body>
</html>
